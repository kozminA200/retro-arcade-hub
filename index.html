<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Fall</title>
    
    <!-- 1. Иконка вкладки сайта -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- 2. Пиксельный 8-битный шрифт Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
        }

        body {
            background-color: #121214;
            color: #fff;
            text-align: center;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            padding-top: 10px;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #00ff66;
            font-size: 20px;
            text-shadow: 3px 3px #005522;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 12px;
            position: relative;
        }

        /* Кубическое игровое поле с ретро-рамкой */
        canvas#gameCanvas {
            background-color: #000;
            border: 4px solid #fff;
            box-shadow: inset 4px 4px 0px #333, 6px 6px 0px #000;
        }

        /* Боковые панели */
        .ui-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .box {
            background: #1c1c22;
            padding: 8px;
            border: 3px solid #555;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #888;
            min-width: 75px;
        }

        .box p {
            margin: 0 0 6px 0;
            color: #888;
            font-size: 9px;
        }

        .box span {
            display: block;
            font-size: 12px;
            color: #00ff66;
        }

        .mini-canvas {
            width: 70px;
            height: 70px;
        }

        /* Оверлей (Пауза / Конец игры) */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #overlay h2 {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #overlay button {
            background: #00ff66;
            color: #000;
            border: 3px solid #fff;
            padding: 10px 15px;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
        }

        /* 4. КУБИЧЕСКИЕ КНОПКИ НА ВСЮ НИЖНЮЮ ЧАСТЬ ЭКРАНА */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 190px;
            background: #18181c;
            border-top: 4px solid #444;
            padding: 8px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 8px;
            z-index: 100;
        }

        .btn {
            background: #2a2a32;
            border: 3px solid #666;
            box-shadow: inset 3px 3px 0px #888, inset -3px -3px 0px #111, 0 3px 0px #000;
            color: #fff;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Эффект нажатия (вдавливание) */
        .btn:active {
            box-shadow: inset -3px -3px 0px #888, inset 3px 3px 0px #111;
            transform: translateY(2px);
        }

        /* Акцентные цвета кнопок действий */
        .btn-hold { color: #00ffff; border-color: #008888; font-size: 11px; }
        .btn-rotate { color: #d442f5; border-color: #8c1da6; font-size: 11px; }
