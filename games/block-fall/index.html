<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Fall</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --controls-h: calc(125px + env(safe-area-inset-bottom, 0px));
            --hud-h: 68px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            text-align: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. ВЕРХНЕЕ ТАБЛО (HUD НАВЕРХУ) */
        .top-hud {
            height: var(--hud-h);
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 8px 0 8px;
            gap: 6px;
        }

        .hud-box {
            background: #1c1c22;
            border: 2px solid #555;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #777;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Окошки HOLD и NEXT */
        .side-preview {
            width: 54px;
            height: 56px;
            padding: 2px;
        }
        .side-preview p { font-size: 6px; color: #888; margin-bottom: 2px; }
        .mini-canvas { width: 40px; height: 40px; }

        /* Центр табло со счетом */
        .hud-center-stats {
            flex: 1;
            height: 56px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 4px;
            padding: 4px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101014;
            border: 1px solid #333;
            padding: 0 6px;
        }
        .stat-item p { font-size: 6px; color: #777; }
        .stat-item span { font-size: 8px; color: #00ff66; }

        /* 2. ЦЕНТРАЛЬНОЕ ИГРОВОЕ ПОЛЕ */
        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: calc(100dvh - var(--hud-h) - var(--controls-h) - 8px);
            padding: 4px;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas#gameCanvas {
            background-color: #000;
            border: 3px solid #fff;
            box-shadow: inset 3px 3px 0px #333, 4px 4px 0px #000;
            height: 100%;
            width: auto;
            aspect-ratio: 10 / 20;
            max-height: 100%;
        }

        /* Оверлей Паузы / Game Over */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #overlay h2 { font-size: 16px; margin-bottom: 12px; }
        #overlay button {
            background: #00ff66; color: #000; border: 3px solid #fff;
            padding: 8px 16px; font-size: 10px; cursor: pointer; box-shadow: 3px 3px 0px #000;
        }

        /* 3. КНОПКИ УПРАВЛЕНИЯ СНИЗУ */
        .mobile-controls {
            height: var(--controls-h);
            width: 100%;
            background: #18181c;
            border-top: 3px solid #444;
            padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px)) 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 5px;
            z-index: 100;
        }

        .btn {
            background: #2a2a32;
            border: 3px solid #666;
            box-shadow: inset 2px 2px 0px #888, inset -2px -2px 0px #111, 0 2px 0px #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:active {
            box-shadow: inset -2px -2px 0px #888, inset 2px 2px 0px #111;
            transform: translateY(2px);
        }

        .btn-hold { color: #00ffff; border-color: #008888; font-size: 10px; }
        .btn-rotate { color: #d442f5; border-color: #8c1da6; font-size: 10px; }
        .btn-drop { color: #ff3344; border-color: #aa1122; font-size: 10px; }
        .btn-dir { font-size: 16px; }

        /* Для ПК */
        @media (min-width: 651px) {
            :root { --controls-h: 0px; --hud-h: 80px; }
            .mobile-controls { display: none; }
            .top-hud { max-width: 500px; height: 80px; }
            .side-preview { width: 68px; height: 68px; }
            .mini-canvas { width: 48px; height: 48px; }
            .side-preview p { font-size: 7px; }
            .stat-item p { font-size: 7px; }
            .stat-item span { font-size: 10px; }
            canvas#gameCanvas { height: 600px; width: 300px; }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯЯ АРКАДНАЯ СТРОКА (HUD ВВЕРХУ) -->
    <div class="top-hud">
        <!-- Окошко HOLD слева -->
        <div class="hud-box side-preview">
            <p>HOLD</p>
            <canvas id="holdCanvas" class="mini-canvas" width="120" height="120"></canvas>
        </div>
        
        <!-- Табло счета по центру -->
        <div class="hud-box hud-center-stats">
            <div class="stat-item"><p>SCORE</p><span id="score">0</span></div>
            <div class="stat-item"><p>BEST</p><span id="highScore">0</span></div>
            <div class="stat-item"><p>LVL</p><span id="level">1</span></div>
            <div class="stat-item"><p>LINES</p><span id="lines">0</span></div>
        </div>

        <!-- Окошко NEXT справа -->
        <div class="hud-box side-preview">
            <p>NEXT</p>
            <canvas id="nextCanvas" class="mini-canvas" width="120" height="120"></canvas>
        </div>
    </div>

    <!-- БОЛЬШОЕ ИГРОВОЕ ПОЛЕ ПО ЦЕНТРУ -->
    <div class="canvas-area">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            
            <div id="overlay">
                <h2 id="overlayTitle">PAUSED</h2>
                <button id="overlayBtn" onclick="togglePause()">RESUME</button>
            </div>
        </div>
    </div>

    <!-- КНОПКИ ВНИЗУ -->
    <div class="mobile-controls">
        <div class="btn btn-hold" id="btnHold">HOLD</div>
        <div class="btn btn-rotate" id="btnRotate">ROTATE</div>
        <div class="btn btn-drop" id="btnDrop">DROP</div>

        <div class="btn btn-dir" id="btnLeft">◀</div>
        <div class="btn btn-dir" id="btnDown">▼</div>
        <div class="btn btn-dir" id="btnRight">▶</div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/board.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
