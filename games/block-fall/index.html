<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Fall</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            text-align: center;
            overflow: hidden;
            touch-action: none;
        }

        /* Общие стили кубических коробок */
        .box {
            background: #1c1c22;
            border: 2px solid #555;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #777;
        }

        canvas#gameCanvas {
            background-color: #000;
            border: 3px solid #fff;
            box-shadow: inset 3px 3px 0px #333, 4px 4px 0px #000;
        }

        /* Оверлей (Пауза / Конец игры) */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #overlay h2 { font-size: 16px; margin-bottom: 12px; }
        #overlay button {
            background: #00ff66; color: #000; border: 3px solid #fff;
            padding: 8px 16px; font-size: 10px; cursor: pointer; box-shadow: 3px 3px 0px #000;
        }

        /* ============================================================
           1. ДЕСКТОПНЫЙ ИНТЕРФЕЙС (ПК): КЛАССИКА С БОКОВЫМИ ПАНЕЛЯМИ
           ============================================================ */
        @media (min-width: 651px) {
            body {
                height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            h1 {
                font-size: 20px;
                color: #00ff66;
                margin-bottom: 20px;
                text-shadow: 2px 2px #005522;
            }

            .game-container {
                display: flex;
                flex-direction: row;
                align-items: flex-start;
                justify-content: center;
                gap: 20px;
            }

            .ui-panel {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .box {
                padding: 10px;
                min-width: 90px;
            }
            .box p { font-size: 8px; color: #888; margin-bottom: 6px; }
            .box span { font-size: 14px; color: #00ff66; }

            .mini-canvas { width: 80px; height: 80px; }
            canvas#gameCanvas { width: 300px; height: 600px; }

            .canvas-wrap {
                position: relative;
            }

            .mobile-controls { display: none; }
        }

        /* ============================================================
           2. МОБИЛЬНЫЙ ИНТЕРФЕЙС (СМАРТФОНЫ): HUD СВЕРХУ + БОЛЬШОЙ СТАКАН
           ============================================================ */
        @media (max-width: 650px) {
            :root {
                --controls-h: calc(130px + env(safe-area-inset-bottom, 0px));
            }

            body {
                height: 100dvh;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            h1 { display: none; } /* На телефоне прячем заголовок ради места */

            /* Грид-раскладка на телефоне: перекидывает боковые панели наверх! */
            .game-container {
                display: grid;
                grid-template-columns: 58px 1fr 1fr 58px;
                grid-template-rows: 27px 27px 1fr;
                grid-template-areas:
                    "hold score best next"
                    "hold level lines next"
                    "canvas canvas canvas canvas";
                gap: 4px;
                width: 100%;
                max-width: 380px;
                margin: 0 auto;
                padding: 6px 6px 0 6px;
                height: calc(100dvh - var(--controls-h) - 6px);
            }

            /* Раскрываем дочерние элементы панелей прямо в верхнюю сетку */
            .panel-left, .panel-right {
                display: contents;
            }

            /* Расстановка элементов в верхнем ряду */
            .box-hold  { grid-area: hold; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .box-next  { grid-area: next; display: flex; flex-direction: column; align-items: center; justify-content: center; }
            .box-score { grid-area: score; display: flex; flex-direction: column; justify-content: center; }
            .box-best  { grid-area: best; display: flex; flex-direction: column; justify-content: center; }
            .box-level { grid-area: level; display: flex; flex-direction: column; justify-content: center; }
            .box-lines { grid-area: lines; display: flex; flex-direction: column; justify-content: center; }

            .box p { font-size: 6px; color: #888; margin-bottom: 2px; }
            .box span { font-size: 9px; color: #00ff66; }
            .mini-canvas { width: 40px; height: 40px; }

            /* Стакан занимает максимум оставшейся высоты */
            .canvas-wrap {
                grid-area: canvas;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
                min-height: 0; /* Чтобы flex не распирал родителя */
                position: relative;
                padding: 4px 0;
            }

            canvas#gameCanvas {
                height: 100%;
                width: auto;
                aspect-ratio: 10 / 20;
                max-height: 100%;
            }

            /* Кнопки внизу */
            .mobile-controls {
                height: var(--controls-h);
                width: 100%;
                background: #18181c;
                border-top: 3px solid #444;
                padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px)) 6px;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: 1fr 1fr;
                gap: 5px;
                z-index: 100;
            }

            .btn {
                background: #2a2a32;
                border: 3px solid #666;
                box-shadow: inset 2px 2px 0px #888, inset -2px -2px 0px #111, 0 2px 0px #000;
                color: #fff;
                display: flex;
                justify-content: center;
                align-items: center;
                cursor: pointer;
                touch-action: manipulation;
            }

            .btn:active {
                box-shadow: inset -2px -2px 0px #888, inset 2px 2px 0px #111;
                transform: translateY(2px);
            }

            .btn-hold { color: #00ffff; border-color: #008888; font-size: 10px; }
            .btn-rotate { color: #d442f5; border-color: #8c1da6; font-size: 10px; }
            .btn-drop { color: #ff3344; border-color: #aa1122; font-size: 10px; }
            .btn-dir { font-size: 16px; }
        }
    </style>
</head>
<body>

    <h1>BLOCK FALL</h1>

    <div class="game-container">
        <!-- Левая панель на ПК / Разбирается наверх на телефоне -->
        <div class="ui-panel panel-left">
            <div class="box box-hold">
                <p>HOLD</p>
                <canvas id="holdCanvas" class="mini-canvas" width="120" height="120"></canvas>
            </div>
            <div class="box box-score">
                <p>SCORE</p>
                <span id="score">0</span>
            </div>
            <div class="box box-best">
                <p>BEST</p>
                <span id="highScore">0</span>
            </div>
        </div>

        <!-- Центральный игровой стакан -->
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            
            <div id="overlay">
                <h2 id="overlayTitle">PAUSED</h2>
                <button id="overlayBtn" onclick="togglePause()">RESUME</button>
            </div>
        </div>

        <!-- Правая панель на ПК / Разбирается наверх на телефоне -->
        <div class="ui-panel panel-right">
            <div class="box box-next">
                <p>NEXT</p>
                <canvas id="nextCanvas" class="mini-canvas" width="120" height="120"></canvas>
            </div>
            <div class="box box-level">
                <p>LEVEL</p>
                <span id="level">1</span>
            </div>
            <div class="box box-lines">
                <p>LINES</p>
                <span id="lines">0</span>
            </div>
        </div>
    </div>

    <!-- Мобильные кнопки снизу -->
    <div class="mobile-controls">
        <div class="btn btn-hold" id="btnHold">HOLD</div>
        <div class="btn btn-rotate" id="btnRotate">ROTATE</div>
        <div class="btn btn-drop" id="btnDrop">DROP</div>

        <div class="btn btn-dir" id="btnLeft">◀</div>
        <div class="btn btn-dir" id="btnDown">▼</div>
        <div class="btn btn-dir" id="btnRight">▶</div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/board.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
