<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Fall</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --controls-h: calc(125px + env(safe-area-inset-bottom, 0px));
            --hud-h: 60px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            text-align: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 1. ВЕРХНЯЯ АРКАДНАЯ ПАНЕЛЬ (HUD) */
        .hud {
            height: var(--hud-h);
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px 0 10px;
            gap: 6px;
        }

        .box {
            background: #1c1c22;
            border: 2px solid #555;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #777;
        }

        .hud-side {
            width: 52px;
            height: 52px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hud-side p { font-size: 6px; color: #888; margin-bottom: 2px; }
        .mini-canvas { width: 38px; height: 38px; }

        .hud-center {
            flex: 1;
            height: 52px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 3px;
            padding: 3px;
        }
        .stat-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #141418;
            border: 1px solid #333;
        }
        .stat-cell p { font-size: 5px; color: #888; margin-bottom: 2px; }
        .stat-cell span { font-size: 8px; color: #00ff66; }

        /* 2. ЦЕНТРАЛЬНАЯ ЗОНА С БОЛЬШИМ СТАКАНАМ */
        .canvas-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-height: calc(100dvh - var(--hud-h) - var(--controls-h) - 10px);
            padding: 4px;
            position: relative;
        }

        .canvas-wrapper {
            position: relative;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas#gameCanvas {
            background-color: #000;
            border: 3px solid #fff;
            box-shadow: inset 3px 3px 0px #333, 4px 4px 0px #000;
            height: 100%;
            width: auto;
            aspect-ratio: 10 / 20;
            max-height: 100%;
            max-width: 100vw;
        }

        /* Оверлей (Пауза / Конец игры) */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        #overlay h2 { font-size: 16px; margin-bottom: 12px; }
        #overlay button {
            background: #00ff66; color: #000; border: 3px solid #fff;
            padding: 8px 16px; font-size: 10px; cursor: pointer; box-shadow: 3px 3px 0px #000;
        }

        /* 3. КОМПАКТНЫЕ ЭРГОНОМИЧНЫЕ КНОПКИ СНИЗУ */
        .mobile-controls {
            height: var(--controls-h);
            width: 100%;
            background: #18181c;
            border-top: 3px solid #444;
            padding: 5px 6px calc(5px + env(safe-area-inset-bottom, 0px)) 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 5px;
            z-index: 100;
        }

        .btn {
            background: #2a2a32;
            border: 3px solid #666;
            box-shadow: inset 2px 2px 0px #888, inset -2px -2px 0px #111, 0 2px 0px #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:active {
            box-shadow: inset -2px -2px 0px #888, inset 2px 2px 0px #111;
            transform: translateY(2px);
        }

        .btn-hold { color: #00ffff; border-color: #008888; font-size: 10px; }
        .btn-rotate { color: #d442f5; border-color: #8c1da6; font-size: 10px; }
        .btn-drop { color: #ff3344; border-color: #aa1122; font-size: 10px; }
        .btn-dir { font-size: 16px; }

        /* Для мониторов компьютеров */
        @media (min-width: 651px) {
            :root { --controls-h: 0px; --hud-h: 80px; }
            .mobile-controls { display: none; }
            .hud { max-width: 500px; height: 80px; }
            .hud-side { width: 70px; height: 70px; }
            .mini-canvas { width: 50px; height: 50px; }
            .hud-side p { font-size: 8px; }
            .stat-cell p { font-size: 7px; }
            .stat-cell span { font-size: 11px; }
            canvas#gameCanvas { height: 600px; width: 300px; }
        }
    </style>
</head>
<body>

    <!-- Верхний компактный HUD -->
    <div class="hud">
        <div class="box hud-side">
            <p>HOLD</p>
            <canvas id="holdCanvas" class="mini-canvas" width="120" height="120"></canvas>
        </div>
        
        <div class="box hud-center">
            <div class="stat-cell"><p>SCORE</p><span id="score">0</span></div>
            <div class="stat-cell"><p>BEST</p><span id="highScore">0</span></div>
            <div class="stat-cell"><p>LVL</p><span id="level">1</span></div>
            <div class="stat-cell"><p>LINES</p><span id="lines">0</span></div>
        </div>

        <div class="box hud-side">
            <p>NEXT</p>
            <canvas id="nextCanvas" class="mini-canvas" width="120" height="120"></canvas>
        </div>
    </div>

    <!-- Большое игровое поле по центру -->
    <div class="canvas-area">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="300" height="600"></canvas>
            
            <div id="overlay">
                <h2 id="overlayTitle">PAUSED</h2>
                <button id="overlayBtn" onclick="togglePause()">RESUME</button>
            </div>
        </div>
    </div>

    <!-- Удобная клавиатура снизу -->
    <div class="mobile-controls">
        <div class="btn btn-hold" id="btnHold">HOLD</div>
        <div class="btn btn-rotate" id="btnRotate">ROTATE</div>
        <div class="btn btn-drop" id="btnDrop">DROP</div>

        <div class="btn btn-dir" id="btnLeft">◀</div>
        <div class="btn btn-dir" id="btnDown">▼</div>
        <div class="btn btn-dir" id="btnRight">▶</div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/board.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
