<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Fall</title>
    
    <!-- Полный набор тегов для иконки во вкладке -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="shortcut icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- 8-битный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --controls-height: 170px;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #fff;
            text-align: center;
            height: 100dvh; /* Ровно высота экрана телефона */
            width: 100vw;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Верхняя игровая зона */
        .game-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: calc(100dvh - var(--controls-height));
            max-height: calc(100dvh - var(--controls-height));
            padding: 6px;
        }

        h1 {
            color: #00ff66;
            font-size: 14px;
            margin-bottom: 6px;
            text-shadow: 2px 2px #005522;
        }

        .game-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            height: calc(100% - 25px);
            max-width: 100%;
        }

        /* Резиновое поле: высота подстраивается автоматически */
        canvas#gameCanvas {
            background-color: #000;
            border: 3px solid #fff;
            box-shadow: inset 3px 3px 0px #333, 4px 4px 0px #000;
            height: 100%;
            width: auto;
            aspect-ratio: 10 / 20; /* Сохраняет строгие пропорции Тетриса */
            max-height: 100%;
        }

        /* Боковые панели */
        .ui-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
            height: 100%;
            justify-content: space-between;
        }

        .box {
            background: #1c1c22;
            padding: 4px;
            border: 2px solid #555;
            box-shadow: inset -2px -2px 0px #000, inset 2px 2px 0px #888;
            min-width: 58px;
        }

        .box p {
            margin-bottom: 3px;
            color: #888;
            font-size: 7px;
        }

        .box span {
            display: block;
            font-size: 10px;
            color: #00ff66;
        }

        .mini-canvas {
            width: 48px;
            height: 48px;
        }

        /* Оверлей Паузы / Game Over */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }

        #overlay h2 {
            font-size: 16px;
            margin-bottom: 15px;
        }

        #overlay button {
            background: #00ff66;
            color: #000;
            border: 3px solid #fff;
            padding: 8px 12px;
            font-size: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
        }

        /* Нижний блок кубических кнопок для смартфонов */
        .mobile-controls {
            height: var(--controls-height);
            width: 100%;
            background: #18181c;
            border-top: 3px solid #444;
            padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)) 6px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            z-index: 100;
        }

        .btn {
            background: #2a2a32;
            border: 3px solid #666;
            box-shadow: inset 3px 3px 0px #888, inset -3px -3px 0px #111, 0 3px 0px #000;
            color: #fff;
            font-size: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            touch-action: manipulation;
        }

        .btn:active {
            box-shadow: inset -3px -3px 0px #888, inset 3px 3px 0px #111;
            transform: translateY(2px);
        }

        .btn-hold { color: #00ffff; border-color: #008888; font-size: 10px; }
        .btn-rotate { color: #d442f5; border-color: #8c1da6; font-size: 10px; }
        .btn-drop { color: #ff3344; border-color: #aa1122; font-size: 10px; }
        .btn-dir { font-size: 18px; }

        /* Для больших экранов (ПК) */
        @media (min-width: 651px) {
            :root { --controls-height: 0px; }
            .mobile-controls { display: none; }
            .game-wrapper { height: 100vh; max-height: 100vh; }
            canvas#gameCanvas { height: 600px; width: 300px; }
            .mini-canvas { width: 80px; height: 80px; }
            .box { min-width: 80px; padding: 8px; }
            .box p { font-size: 9px; }
            .box span { font-size: 14px; }
            h1 { font-size: 20px; margin-bottom: 12px; }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <h1>BLOCK FALL</h1>
        
        <div class="game-container">
            <!-- Левая панель: Hold + Очки -->
            <div class="ui-panel">
                <div class="box"><p>HOLD</p><canvas id="holdCanvas" class="mini-canvas" width="120" height="120"></canvas></div>
                <div class="box"><p>SCORE</p><span id="score">0</span></div>
                <div class="box"><p>BEST</p><span id="highScore">0</span></div>
            </div>

            <!-- Игровое поле -->
            <div style="position: relative; height: 100%;">
                <canvas id="gameCanvas" width="300" height="600"></canvas>
                <div id="overlay">
                    <h2 id="overlayTitle">PAUSED</h2>
                    <button id="overlayBtn" onclick="togglePause()">RESUME</button>
                </div>
            </div>
            
            <!-- Правая панель: Next + Уровень -->
            <div class="ui-panel">
                <div class="box"><p>NEXT</p><canvas id="nextCanvas" class="mini-canvas" width="120" height="120"></canvas></div>
                <div class="box"><p>LEVEL</p><span id="level">1</span></div>
                <div class="box"><p>LINES</p><span id="lines">0</span></div>
            </div>
        </div>
    </div>

    <!-- Мобильный пульт управления на всю ширину снизу -->
    <div class="mobile-controls">
        <div class="btn btn-hold" id="btnHold">HOLD</div>
        <div class="btn btn-rotate" id="btnRotate">ROTATE</div>
        <div class="btn btn-drop" id="btnDrop">DROP</div>

        <div class="btn btn-dir" id="btnLeft">◀</div>
        <div class="btn btn-dir" id="btnDown">▼</div>
        <div class="btn btn-dir" id="btnRight">▶</div>
    </div>
    
    <script src="js/constants.js"></script>
    <script src="js/piece.js"></script>
    <script src="js/board.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
